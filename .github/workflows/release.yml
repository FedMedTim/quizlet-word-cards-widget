name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Ключ подписи хранится секретом в base64. Если его нет, сборка не падает:
      # build.gradle.kts откатывается на отладочную подпись. Разница в том, что
      # отладочный ключ в CI генерируется заново каждый прогон, и обновить
      # установленное приложение поверх не выйдет — только переустановкой.
      - name: Развернуть ключ подписи
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          # tr снимает переводы строк и пробелы: в секрет легко занести лишний
          # \r при заливке из Windows, а base64 -d на нём падает.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/wordcards.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wordcards.jks" >> "$GITHUB_ENV"

      - name: Собрать release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # Имя файла не содержит версию: постоянная ссылка
      # /releases/latest/download/wordcards.apk работает только при стабильном имени.
      - name: Подготовить файл
        run: cp app/build/outputs/apk/release/app-release.apk wordcards.apk

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" wordcards.apk \
            --title "Карточки слов $VERSION" \
            --target "$GITHUB_SHA" \
            --notes "$(cat <<'NOTES'
          ## Установка

          1. Скачайте `wordcards.apk` ниже прямо на телефон.
          2. Откройте файл — Android спросит разрешение на установку из этого источника, дайте его.
          3. Запустите «Карточки слов», войдите в Quizlet и вставьте ссылку на набор.
          4. Зажмите свободное место на рабочем столе → «Виджеты» → «Карточки слов», перетащите 2×2 или 4×2.

          Постоянная ссылка на свежую версию:
          https://github.com/FedMedTim/quizlet-word-cards-widget/releases/latest/download/wordcards.apk
          NOTES
          )"
