name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle ставится экшеном, а не через wrapper: бинарник gradle-wrapper.jar
      # держать в репозитории не нужно.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать debug APK
        run: gradle assembleDebug --stacktrace

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcards-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
